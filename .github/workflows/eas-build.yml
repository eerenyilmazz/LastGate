name: EAS Build

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  # ── Type check & lint on every push / PR ──────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  # ── Preview build on every push to main ───────────────────────────────
  build-preview:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    needs: typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (preview)
        run: eas build --platform android --profile preview --non-interactive
        env:
          ADMOB_ANDROID_ID:   ${{ secrets.ADMOB_ANDROID_ID }}
          ADMOB_IOS_ID:       ${{ secrets.ADMOB_IOS_ID }}
          SENTRY_DSN:         ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN:  ${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── Production build on version tags ──────────────────────────────────
  build-production:
    name: EAS Production Build
    runs-on: ubuntu-latest
    needs: typecheck
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (production)
        run: eas build --platform android --profile production --non-interactive
        env:
          ADMOB_ANDROID_ID:  ${{ secrets.ADMOB_ANDROID_ID }}
          ADMOB_IOS_ID:      ${{ secrets.ADMOB_IOS_ID }}
          SENTRY_DSN:        ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: EAS Submit (auto-submit to stores)
        run: eas submit --platform android --latest --non-interactive
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
